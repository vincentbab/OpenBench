<colgroup>

    <col class="c-author">
    <col class="c-engine">
    <col class="c-name">
    <col class="c-diff">
    <col class="c-tc">
    <col class="c-stats">
    <col class="c-info">
</colgroup>

        <th>Engine</th>

        <th>Info</th>
    </tr>
</thead>
