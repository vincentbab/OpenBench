{% if paging.prev != paging.next %}
    <nav class="pagination" aria-label="Pages">
        {% if paging.page > 1 %}
            <a href="/{{ paging.url }}/{{ paging.prev }}/{{ paging.query }}" aria-label="Previous"><i class="fa-solid fa-chevron-left"></i></a>
        {% endif %}
        {% for page in paging.pages %}
            {% if page == "..." %}
                <span>…</span>
            {% elif page == paging.page %}
                <a class="current" href="/{{ paging.url }}/{{ page }}/{{ paging.query }}">{{ page }}</a>
            {% else %}
                <a href="/{{ paging.url }}/{{ page }}/{{ paging.query }}">{{ page }}</a>
            {% endif %}
        {% endfor %}
        {% if paging.next != paging.page %}
            <a href="/{{ paging.url }}/{{ paging.next }}/{{ paging.query }}" aria-label="Next"><i class="fa-solid fa-chevron-right"></i></a>
        {% endif %}
    </nav>
{% endif %}
